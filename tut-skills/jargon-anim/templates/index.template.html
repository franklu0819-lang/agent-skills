<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#0d1017; --ink:#F2F5FA; --sub:#9AA3B2; --blue:#5B8CFF;
    --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC",-apple-system,"Helvetica Neue",sans-serif;color:var(--ink)}
  #stage{position:relative;width:1920px;height:1080px}
  section{position:absolute;inset:0;opacity:0}
  .abs{position:absolute}

  #bg{position:absolute;inset:0;
    background:
      radial-gradient(1200px 700px at 50% 42%, rgba(91,140,255,.10), transparent 65%),
      radial-gradient(900px 600px at 85% 90%, rgba(139,124,255,.06), transparent 60%),
      var(--bg);}
  #bg::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:96px 96px;mask-image:radial-gradient(1100px 650px at 50% 45%,#000 30%,transparent 75%)}
  .brand{position:absolute;top:44px;font-size:24px;letter-spacing:2px;color:rgba(255,255,255,.38);font-weight:600}
  #bl{left:64px}  #br{right:64px;letter-spacing:3px}

  /* ============ 场景构件库(生效 CSS,按需取用) ============
     纪律:① 任何元素不用 CSS transform 居中(JS 会覆盖 transform),
            居中一律 left:0;right:0;margin:0 auto / text-align:center / flex;
          ② 字幕安全区:底部 y≥850 归字幕,画面元素底边 ≤830;
          ③ opacity:0 的元素仍占 flex 空间,动态内容放独立绝对定位层 */

  .t{left:0;right:0;text-align:center;font-size:64px;font-weight:800;letter-spacing:2px}
  .t b{color:var(--blue)}
  .pill{padding:22px 32px;border-radius:14px;background:var(--card);border:1px solid var(--line);
    font-size:40px;font-weight:700;white-space:nowrap}
  .mini{padding:20px 26px;border-radius:14px;font-size:38px;font-weight:800;color:#0d1017;white-space:nowrap}
  .gcard{width:440px;height:370px;background:var(--card);border:1px solid var(--line);border-radius:26px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
  .crow{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:30px}
  .fn{left:0;right:0;text-align:center;font-size:26px;color:rgba(255,255,255,.45);letter-spacing:2px}

  /* ---- 片尾 outro(收尾场景照抄) ---- */
  #outro{text-align:center}
  #outro .ot{font-size:88px;font-weight:800;letter-spacing:10px}
  #outro .oe{font-size:28px;color:var(--sub);letter-spacing:6px;margin-top:22px}
  #outro .odash{width:520px;height:1px;background:var(--line);margin:44px auto}
  #outro .onx{font-size:36px;color:var(--ink);letter-spacing:2px}
  #outro .onx b{color:var(--blue)}
  #outro .dots{display:flex;gap:16px;justify-content:center;margin-top:40px}
  #outro .dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18)}
  #outro .dots i.on{background:var(--blue)}
  #veil{position:absolute;inset:0;background:#080a0f;opacity:0;pointer-events:none}

  /* ---- 示例场景样式(可改可删) ---- */
  #demo-t{left:0;right:0;top:170px;text-align:center;font-size:64px;font-weight:800;letter-spacing:2px}
  #demo-t b{color:var(--blue)}
  #demo-row{position:absolute;left:0;right:0;top:48%;display:flex;align-items:center;justify-content:center;gap:30px}
  #s1-note{left:0;right:0;top:700px;text-align:center;font-size:28px;color:var(--sub)}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div class="brand" id="bl">AI 黑话图鉴</div>
  <div class="brand" id="br">EP.NN · SLUG</div><!-- 改成本期角标,如 EP.03 · 上下文窗口 -->

  <!-- ============ 场景区:script.json 每个场景一个 section,每个 beat 一个动画节拍 ============
       常用 7 段式: s1 钩子 / s2 揭示 / s3 机制 / s4 数量级 / s5 tip / s6 金句 / s7 预告
       RENDER 注册表必须与 section 一一对应,漏注册会在该场景帧直接报错 -->

  <section id="sc1">
    <div class="abs" id="demo-t">示例：<b>概念名</b>是什么？</div>
    <div id="demo-row">
      <div class="mini" id="demo-a" style="background:#5B8CFF">要素一</div>
      <div class="mini" id="demo-b" style="background:#FF9F5A">要素二</div>
    </div>
    <div class="abs" id="s1-note">动画锚点用 B('句id') 跟随语音</div>
  </section>

  <!-- 收尾场景模板(最后一个场景照此):section 必须带 flex 居中(否则 outro 停左上角) -->
  <section id="sc2" style="display:flex;align-items:center;justify-content:center">
    <div class="abs" id="s7-q" style="left:0;right:0;top:44%;text-align:center;font-size:72px;font-weight:700">（收尾问句，退场演示）</div>
    <div id="outro">
      <div class="ot">AI 黑话图鉴</div>
      <div class="oe">EP.NN · SLUG</div><!-- 与右上角标一致 -->
      <div class="odash"></div>
      <div class="onx">下期预告：<b>下一期主题</b> —— 一句话钩子</div>
      <div class="dots"><i class="on"></i><i></i><i></i><i></i></div><!-- 第 N 个点亮 = 第 N 期 -->
    </div>
  </section>

  <div id="veil"></div>
</div>

<script>
/* ================= 确定性动画引擎 =================
   renderFrame(frame) 由渲染脚本逐帧调用,任何帧可独立重算。 */
const FPS = 30, W = 1920, H = 1080;
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const E = (t,a,b)=>clamp((t-a)/(b-a),0,1);
const eOutC = p=>1-Math.pow(1-p,3);
const eOutB = p=>{const c=1.70158;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const o=(el,v)=>{el.style.opacity=v};
const ty=(el,v)=>{el.style.transform=`translateY(${v}px)`};
function fadeUp(el,t,t0,d=0.5,dist=44){const e=eOutC(E(t,t0,t0+d));o(el,e);ty(el,(1-e)*dist)}
function pop(el,t,t0,d=0.5,s0=0.6){const e=eOutB(E(t,t0,t0+d));o(el,E(t,t0,t0+d*0.5));el.style.transform=`scale(${s0+(1-s0)*e})`}

/* 场景时间轴:puppeteer 注入 scenes+beatsMap;B('s2b2') 返回该句相对场景开头的秒数 */
let SCENES = [], BEATS = {};
const B = id => (BEATS[id] || 0) - curScene.t0;
let curScene = {t0:0, end:0};

/* ---- 示例场景渲染(t=场景内秒数) ---- */
function s1(t){
  fadeUp($("demo-t"),t,0.3,0.5);
  pop($("demo-a"),t,B('s1b1')+0.3,0.55,0.7);
  pop($("demo-b"),t,B('s1b1')+0.9,0.55,0.7);
  fadeUp($("s1-note"),t,B('s1b2')+0.2,0.5,20);
}
/* ---- 收尾场景:问句退场 + outro 入场 + 片尾黑场(veil 只在这里设置!) ---- */
function s2(t){
  const q=$("s7-q");
  if(t<B('s2b1')) pop(q,t,0.4,0.7,0.7);
  else { const p=E(t,B('s2b1'),B('s2b1')+0.4); o(q,1-p); ty(q,p*-90); }
  fadeUp($("outro"),t,B('s2b2')+0.2,0.6,36);
  const dur = curScene.end - curScene.t0;
  o($("veil"), E(t,dur-0.9,dur-0.1));
}
const RENDER = {s1,s2};

window.__initScenes = function(scenes, beats){
  SCENES = scenes; BEATS = beats || {};
};
window.renderFrame = function(frame){
  const t = frame/FPS;
  const sc = SCENES.find(s=>t>=s.start && t<s.end) || SCENES[SCENES.length-1];
  const fn = RENDER[sc.id];
  if(typeof fn !== "function"){
    throw new Error(`场景 ${sc.id} 未在 RENDER 注册(检查 script.json 场景与 index.html 是否一一对应)`);
  }
  document.querySelectorAll("section").forEach(el=>{
    el.style.opacity = el.id==="sc"+sc.id.slice(1) ? 1 : 0;
  });
  curScene = {t0:sc.start, end:sc.end};
  fn(t - sc.start);
  /* ⚠️ 不要在这里设置 veil —— 由收尾场景函数全权负责,否则重编号后黑场会错位 */
};
</script>
</body>
</html>
